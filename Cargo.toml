[package]
name = "tone3000"
version = "0.1.0"
edition = "2024"
# Set by url -> idna_adapter -> icu_*, not by this crate's own code. Verified with
# `cargo msrv`. An MSRV bump is a minor version bump.
rust-version = "1.86"
license = "MIT"
description = "Async Rust client for the TONE3000 API (v1)"
repository = "https://github.com/OpenSauce/tone3000-rs"
keywords = ["tone3000", "nam", "neural-amp-modeler", "guitar", "api"]
categories = ["api-bindings"]
# Keep the published crate to what a consumer can use. tests/ and examples/ stay:
# they are documentation.
exclude = [".github/", "scripts/", "Makefile", "CLAUDE.md", "docs/"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form", "query"] }
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
bytes = "1"
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
# Used by the play_with_nam_rs example and the README doctest, to prove the pairing
# this crate advertises actually compiles. Never reaches consumers.
nam-rs = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
